<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.js" integrity="sha256-H+K7U5CnXl1h5ywQfKtSj8PCmoN9aaq30gDh27Xc0jk=" crossorigin="anonymous"></script>
    <! -- i couldnt use the css outside the html file so i kept here -->
    <style>
        body {
            background-image: linear-gradient(45deg, transparent 20%, grey 25%, transparent 25%),
                linear-gradient(-45deg, transparent 20%, grey 25%, transparent 25%),
                linear-gradient(-45deg, transparent 75%, grey 80%, transparent 0),
                radial-gradient(turquoise 2px, transparent 0);
            background-size: 30px 30px, 30px 30px;
        }
        #chatbox{
            margin-left: auto;
            margin-right: auto;
            width: 80%;
            margin-top: 50px;
        }
        .botText{
            font-size: 16px;
            font-weight: bold;
            text-align:left;
            line-height: 26px;
            color: black;
            font-family: 'Verdana', sans-serif;
            text-indent: 30px;
            margin: 0;
        }
        #userInput{
            margin-left: auto;
            margin-right: auto;
            width: 80%;
            text-align: center;
            margin-top: 50px;
        }
        #textInput{
            border:3px dotted white;
            border-bottom: 3px dotted #657889;
            font-family: 'Verdana', sans-serif;
            font-size: 16px;
            width: 60%;
            background: none;
            padding: 20px;
            color:black;
            font-weight: bold;
        }
        #buttonInput {
            background: #B9DFFF;
            color: whitesmoke;
            font-size: 16px;
            border: 3ppx solid #eee;
            border-radius: 20px;
            box-shadow: 5px 5px 5px #eee;
            padding: 10px;
            text-shadow: none;
        }
        #buttonInput:hover {
            background: grey;
            color: #fff;
            border: 1px solid #eee;
            border-radius: 20px;
            box-shadow: 5px 5px 5px #eee;
            text-shadow: none;
        }
        h1{
            text-align: center;
            color: black;
            font-family: 'Helvetica Neue', sans-serif;
            font-size: 46px;
            font-weight: 100;
            line-height: 50px;
            letter-spacing: 1px;
            padding: 0 0 40px;   
        }
        .userText{
            text-align:right;
            font-family: 'Verdana', sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>
    
    <h1> Employee Integration Chatbot </h1>
    <div>
    <div id = "chatbox">
        <p class = "botText"> <span>welcome i will be pleased to help you</span></p>
    </div>
    <div id="userInput">
        <input id = "textInput" type = "text" name = "userMessage" placeholder="type your message"/>
        <input id="buttonInput" type="submit" value="Send"/>
    
    </div>


    </div>
    <script>
        function getUserResponse(){

            var userText = $('#textInput').val();
            var userHTML = "<p class='userText'> User : <span>"+userText+"</span></p>";
            $('#textInput').val("");
            $('#chatbox').append(userHTML);
            document.getElementById("userInput").scrollIntoView({block:'start',behavior:'smooth'});
            $.get("/get",{userMessage: userText}).done(function(data){
                var botHTML = "<p class = 'botText'> Chatbot : <span>"+data+"</span></p>";
                $('#chatbox').append(botHTML);
                
            });
        }
        $("#textInput").keypress(function(e){
            if(e.which == 13){
                getUserResponse();
            }

        });
        $("#buttonInput").click(function(e){
            getUserResponse();
        });


    </script>

</body>
</html>
